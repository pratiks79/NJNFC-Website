<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsors | NJNFC - Our Proud Community Partners</title>
  <meta name="description" content="Meet the proud local business sponsors and community partners who champion NJNFC's mission of youth soccer and cultural enrichment in New Jersey.">
  <link rel="icon" type="image/png" href="assets/icons/njnfc-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main>
    <section class="section-padding" style="padding-top: 5rem; padding-bottom: 2rem;">
      <div class="container">
        <div class="section-header">
          <div class="section-badge">
            <i data-lucide="building" style="width: 14px; height: 14px;"></i>
            <span>Our Community Partners</span>
          </div>
          <h1 class="section-title">Proud Sponsors of NJNFC</h1>
          <p class="section-subtitle">
            We extend our heartfelt gratitude to local businesses and partners who champion community athletics and cultural enrichment.
          </p>
        </div>
      </div>
    </section>

    <section class="section-padding bg-secondary-theme">
      <div class="container">
        <div class="sponsors-grid" id="sponsors-container">
          <!-- Populated via JS -->
        </div>

        <div style="text-align: center; margin-top: 3rem;">
          <button class="btn btn-secondary" onclick="openSponsorModal()">
            <i data-lucide="handshake" style="width: 16px; height: 16px;"></i> Become an Official NJNFC Sponsor
          </button>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <div id="modals-placeholder"></div>

  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
